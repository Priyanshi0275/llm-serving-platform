name: model-release-gate

on:
  push:
    paths:
      - "results/**"
      - "bench/gate.py"
  pull_request:
    paths:
      - "results/**"
      - "bench/gate.py"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gate must reject the known-bad candidate (awq-4bit)
        run: |
          if python bench/gate.py fp16-baseline awq-4bit; then
            echo "Gate approved a candidate that should be rejected"
            exit 1
          else
            echo "Gate rejected awq-4bit as expected"
          fi